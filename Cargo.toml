[workspace]
members = [
    "crates/search-core",
    "crates/search-frecency",
    "crates/search-index",
    "crates/search-cli",
    "crates/search-bench",
    "crates/search-server",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.5.8"
license = "MIT"
authors = ["Codex"]

[workspace.dependencies]
anyhow = "1.0.104"
bincode = { version = "2.0.1", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
globset = "0.4.20"
ignore = "0.4.33"
libc = "0.2.189"
memmap2 = "0.9.11"
num_cpus = "1.17.0"
regex = "1.13.1"
regex-syntax = "0.8.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
toml = "1.1.6"
toml_edit = "0.25.15"
which = "8"
rayon = "1.12.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
notify = "8"
flate2 = "1.1.10"
sha2 = "0.11"
tar = "0.4.46"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
